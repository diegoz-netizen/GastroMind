# Conexión a la base de datos PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/gastromind_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
gastromind.jwt.secret=GastroMindSecretKeyForJWTTokenGeneration2026ChangedForSecurity
gastromind.jwt.expiration-ms=86400000