spring.application.name=backend-spring

spring.profiles.active=local

# Fechas en UTC al leer/escribir en la BD (ver BackendSpringApplication)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- CONFIGURACIÓN BASE DE DATOS POSTGRESQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gastromind_demo
spring.datasource.username=postgres
spring.datasource.password=Soltero1001@
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONFIGURACIÓN JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# HU-04: SMTP (Mailtrap en desarrollo). Credenciales por variables de entorno, nunca en el repo.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# HU-04: enlace de recuperación (CA-04: caduca a los 15 min)
gastromind.recuperacion.expiracion-minutos=15
gastromind.recuperacion.url-restablecer=http://localhost:5173/restablecer

# --- SEGURIDAD JWT ---
gastromind.jwt.secret=mi_clave_secreta_super_segura_gastromind_2026_jwt_token_secret_key_123456